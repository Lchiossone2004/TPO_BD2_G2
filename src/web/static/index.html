<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FarmaRed · Consola de consultas</title>
  <link rel="stylesheet" href="/static/styles.css?v=4" />
  <script src="/static/app.js?v=4" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">+</span>
      <div>
        <strong>FarmaRed S.A.</strong>
      </div>
    </div>
    <div class="top-right">
      <span class="pill" id="pill-date" title="Fecha de negocio (hoy())">—</span>
      <span class="pill" id="pill-mongo"><i class="dot"></i>MongoDB</span>
      <span class="pill" id="pill-redis"><i class="dot"></i>Redis</span>
      <button class="btn ghost" id="btn-reset" type="button" title="Recarga los datos y recrea el escenario de q15">Reiniciar datos</button>
      <a class="btn ghost" href="/docs" target="_blank" rel="noopener">Swagger</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Consultas"></aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
